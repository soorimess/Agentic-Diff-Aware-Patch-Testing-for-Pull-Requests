[project]
name = "openhands-f2p"
version = "0.1.0"
description = "An OpenHands agent that writes fail-to-pass regression tests for SWE-bench Verified pull requests"
readme = "README.md"
authors = [
    { name = "soorimess", email = "soroushmesgari2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mutmut>=3",
    "openhands-sdk>=1.43.1",
    "openhands-tools>=1.43.1",
    "openhands-workspace>=1.43.1",
]

[project.scripts]
openhands-f2p = "openhands_f2p:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
